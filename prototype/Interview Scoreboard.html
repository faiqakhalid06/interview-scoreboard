<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interview Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F6F8;--surface:#FFFFFF;--ink:#101828;--muted:#5B6475;--line:#E1E4EA;--accent:#2F4BFF;--accent-ink:#FFFFFF;--soft:#E9ECFF;--ok:#12805C;--bad:#B42318;
  --head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'Public Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E121B;--surface:#171C28;--ink:#EEF1F6;--muted:#9AA3B5;--line:#2A3142;--accent:#7C8DFF;--accent-ink:#0E121B;--soft:#232B4D;--ok:#4CC9A0;--bad:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E121B;--surface:#171C28;--ink:#EEF1F6;--muted:#9AA3B5;--line:#2A3142;--accent:#7C8DFF;--accent-ink:#0E121B;--soft:#232B4D;--ok:#4CC9A0;--bad:#FF8A80;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body)}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font:700 26px/1.1 var(--head);margin:0;letter-spacing:-.02em}
h2{font:600 19px/1.2 var(--head);margin:0 0 10px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
select,input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:600 14px var(--body);color:var(--muted);cursor:pointer;margin-bottom:-1px}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 12px var(--body);color:var(--muted)}
tr:last-child td{border-bottom:0}
.rank{font:700 28px/1 var(--head);width:48px;color:var(--muted)}
tr.first .rank{color:var(--accent)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;min-width:110px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.num{font:600 18px var(--head);font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:13px}
.btn{font:600 14px var(--body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer;min-height:38px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--ink)}
.pill.done{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.crit{padding:12px 0;border-bottom:1px solid var(--line)}
.crit:last-of-type{border-bottom:0}
.crit .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
input[type=range]{width:100%;accent-color:var(--accent);margin:8px 0 0}
.msg{padding:10px 12px;border-radius:8px;background:var(--soft);font-size:14px;margin-bottom:14px}
.msg.err{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.empty{color:var(--muted);padding:12px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}h1{font-size:22px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Interview Scoreboard</h1>
    <label class="who">Viewing as
      <select id="role" aria-label="Viewing as"></select>
    </label>
  </header>
  <nav id="tabs" role="tablist"></nav>
  <div id="msg" aria-live="polite"></div>
  <main id="main"></main>
  <p class="sub">Prototype: the role switcher stands in for login. Data is saved in this browser only.</p>
  <button class="btn" id="reset">Reset demo data</button>
</div>

<script>
const KEY='scoreboard-proto-v1';
const seed=()=>({
  criteria:[{id:'c1',name:'Technical knowledge',w:40},{id:'c2',name:'Problem-solving',w:30},{id:'c3',name:'Communication',w:20},{id:'c4',name:'Confidence',w:10}],
  candidates:[{id:'a1',name:'Ali Raza',pos:'Backend Developer'},{id:'a2',name:'Sara Khan',pos:'Backend Developer'},{id:'a3',name:'Hina Malik',pos:'Backend Developer'}],
  judges:[{id:'j1',name:'Judge Ahmed'},{id:'j2',name:'Judge Noor'},{id:'j3',name:'Judge Bilal'}],
  scores:{
    'j1|a1':{c1:8,c2:6,c3:7,c4:9},'j2|a1':{c1:7,c2:7,c3:8,c4:8},
    'j1|a2':{c1:9,c2:8,c3:9,c4:7},'j2|a2':{c1:8,c2:9,c3:8,c4:8},'j3|a2':{c1:9,c2:8,c3:7,c4:9},
    'j2|a3':{c1:6,c2:7,c3:6,c4:5}
  }
});
let S=load();
let role='admin',tab='ranking',draft=null,flash=null;

function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const uid=p=>p+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);

// ---- scoring logic ----
function weightedTotal(marks){
  const tw=S.criteria.reduce((a,c)=>a+Number(c.w),0);
  if(!tw)return 0;
  return S.criteria.reduce((a,c)=>a+(Number(marks[c.id])||0)*Number(c.w),0)/tw;
}
function results(){
  return S.candidates.map(c=>{
    const per=S.judges.map(j=>{const m=S.scores[j.id+'|'+c.id];return m?weightedTotal(m):null});
    const done=per.filter(v=>v!==null);
    const avg=done.length?done.reduce((a,b)=>a+b,0)/done.length:null;
    return {c,per,count:done.length,avg};
  }).sort((a,b)=>(b.avg??-1)-(a.avg??-1));
}
const f1=n=>n===null?'–':n.toFixed(1);

// ---- views ----
function setMsg(t,err){flash=t?{t,err}:null;$('msg').innerHTML=t?`<div class="msg${err?' err':''}">${esc(t)}</div>`:''}

function renderRole(){
  $('role').innerHTML='<option value="admin">Admin</option>'+S.judges.map(j=>`<option value="${j.id}">${esc(j.name)}</option>`).join('');
  if(role!=='admin'&&!S.judges.find(j=>j.id===role))role='admin';
  $('role').value=role;
}
function renderTabs(){
  const t=[['ranking','Ranking'],['score','Score']];
  if(role==='admin')t.push(['setup','Setup']);
  if(!t.find(x=>x[0]===tab))tab='ranking';
  $('tabs').innerHTML=t.map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}</button>`).join('');
}

function viewRanking(){
  const R=results();
  if(!R.length)return '<div class="card empty">No candidates yet. Add some in Setup.</div>';
  const head=S.judges.map(j=>`<th>${esc(j.name.replace('Judge ',''))}</th>`).join('');
  const rows=R.map((r,i)=>`<tr class="${i===0&&r.avg!==null?'first':''}">
    <td class="rank">${r.avg===null?'–':i+1}</td>
    <td><strong>${esc(r.c.name)}</strong><div class="sub">${esc(r.c.pos)}</div></td>
    ${r.per.map(v=>`<td class="sub">${f1(v)}</td>`).join('')}
    <td style="width:26%"><div class="row" style="flex-wrap:nowrap"><span class="num">${f1(r.avg)}</span><div class="bar" style="flex:1"><i style="width:${r.avg===null?0:r.avg*10}%"></i></div></div>
      <div class="sub">${r.count} of ${S.judges.length} judges</div></td></tr>`).join('');
  return `<div class="card"><h2>Final ranking</h2><div class="sub" style="margin-bottom:8px">Each judge’s weighted total out of 10, then the average across judges who have scored.</div>
  <div class="scroll"><table><thead><tr><th></th><th>Candidate</th>${head}<th>Final score</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function viewScore(){
  if(role==='admin')return '<div class="card empty">Admins don’t score. Switch “Viewing as” to a judge to enter marks.</div>';
  if(draft)return viewForm();
  if(!S.candidates.length)return '<div class="card empty">No candidates to score yet.</div>';
  const items=S.candidates.map(c=>{
    const m=S.scores[role+'|'+c.id];
    return `<li><div><strong>${esc(c.name)}</strong><div class="sub">${esc(c.pos)}</div></div>
      <div class="row">${m?`<span class="pill done">Submitted ${f1(weightedTotal(m))}</span><button class="btn" data-act="view" data-id="${c.id}">View marks</button>`
      :`<span class="pill">Not scored</span><button class="btn primary" data-act="start" data-id="${c.id}">Score</button>`}</div></li>`;
  }).join('');
  return `<div class="card"><h2>Candidates to score</h2><ul class="list">${items}</ul></div>`;
}

function viewForm(){
  const c=S.candidates.find(x=>x.id===draft.id);
  const locked=!!S.scores[role+'|'+draft.id];
  const rows=S.criteria.map(k=>{
    const v=draft.marks[k.id]??5;
    return `<div class="crit"><div class="top"><label for="m_${k.id}"><strong>${esc(k.name)}</strong> <span class="sub">weight ${k.w}%</span></label><span class="num" id="o_${k.id}">${v}</span></div>
      <input type="range" min="0" max="10" step="1" value="${v}" id="m_${k.id}" data-crit="${k.id}" ${locked?'disabled':''}></div>`;
  }).join('');
  return `<div class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">${esc(c.name)}</h2><div class="sub">${esc(c.pos)}</div></div>
    <div style="text-align:right"><div class="sub">Weighted total</div><div class="num" id="tot" style="font-size:28px">${f1(weightedTotal(draft.marks))}</div></div></div>
    <div style="margin-top:8px">${rows}</div>
    <div class="row" style="margin-top:14px">${locked?'<span class="sub">Submitted. Marks are locked.</span>':'<button class="btn primary" data-act="submit">Submit marks</button>'}
    <button class="btn" data-act="back">Back</button></div></div>`;
}

function viewSetup(){
  const sum=S.criteria.reduce((a,c)=>a+Number(c.w),0);
  return `<div class="grid2">
  <div class="card"><h2>Criteria and weights</h2>
    <ul class="list">${S.criteria.map(c=>`<li><span>${esc(c.name)}</span><span class="row"><input type="number" min="0" max="100" value="${c.w}" data-w="${c.id}" style="width:72px" aria-label="Weight for ${esc(c.name)}">%
      <button class="btn danger" data-act="delcrit" data-id="${c.id}" aria-label="Remove ${esc(c.name)}">Remove</button></span></li>`).join('')}</ul>
    <div class="sub" style="margin:8px 0">Weights add up to ${sum}%${sum===100?'':'. Totals are scaled so this still works, but 100% is easier to read.'}</div>
    <div class="row"><input type="text" id="nc" placeholder="New criterion" aria-label="New criterion"><button class="btn" data-act="addcrit">Add criterion</button></div></div>
  <div class="card"><h2>Judges</h2>
    <ul class="list">${S.judges.map(j=>`<li><span>${esc(j.name)}</span><button class="btn danger" data-act="deljudge" data-id="${j.id}" aria-label="Remove ${esc(j.name)}">Remove</button></li>`).join('')||'<li class="empty">No judges yet.</li>'}</ul>
    <div class="row" style="margin-top:8px"><input type="text" id="nj" placeholder="Judge name" aria-label="Judge name"><button class="btn" data-act="addjudge">Add judge</button></div></div>
  <div class="card" style="grid-column:1/-1"><h2>Candidates</h2>
    <ul class="list">${S.candidates.map(c=>`<li><span><strong>${esc(c.name)}</strong> <span class="sub">${esc(c.pos)}</span></span><button class="btn danger" data-act="delcand" data-id="${c.id}" aria-label="Remove ${esc(c.name)}">Remove</button></li>`).join('')||'<li class="empty">No candidates yet.</li>'}</ul>
    <div class="row" style="margin-top:8px"><input type="text" id="ncn" placeholder="Candidate name" aria-label="Candidate name"><input type="text" id="ncp" placeholder="Position" aria-label="Position"><button class="btn" data-act="addcand">Add candidate</button></div></div>
  </div>`;
}

function render(){
  renderRole();renderTabs();
  $('main').innerHTML=tab==='ranking'?viewRanking():tab==='score'?viewScore():viewSetup();
}

// ---- events ----
$('role').addEventListener('change',e=>{role=e.target.value;draft=null;setMsg('');render()});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;draft=null;setMsg('');render()});
$('reset').addEventListener('click',()=>{S=seed();draft=null;role='admin';tab='ranking';save();setMsg('Demo data restored.');render()});

$('main').addEventListener('input',e=>{
  const k=e.target.dataset.crit;
  if(k&&draft){
    draft.marks[k]=Number(e.target.value);
    $('o_'+k).textContent=e.target.value;
    $('tot').textContent=f1(weightedTotal(draft.marks));
  }
});
$('main').addEventListener('change',e=>{
  const id=e.target.dataset.w;
  if(id){
    let v=Math.max(0,Math.min(100,Number(e.target.value)||0));
    S.criteria.find(c=>c.id===id).w=v;save();render();
  }
});
$('main').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  setMsg('');
  if(a==='start'){draft={id,marks:Object.fromEntries(S.criteria.map(c=>[c.id,5]))}}
  else if(a==='view'){draft={id,marks:{...S.scores[role+'|'+id]}}}
  else if(a==='back'){draft=null}
  else if(a==='submit'){
    const key=role+'|'+draft.id;
    if(S.scores[key]){setMsg('You have already scored this candidate.',true)}
    else{
      const ok=S.criteria.every(c=>Number.isInteger(draft.marks[c.id])&&draft.marks[c.id]>=0&&draft.marks[c.id]<=10);
      if(!ok){setMsg('Every mark must be between 0 and 10.',true)}
      else{S.scores[key]={...draft.marks};save();setMsg('Marks submitted.');draft=null}
    }
  }
  else if(a==='addcrit'){const n=$('nc').value.trim();if(!n){setMsg('Enter a criterion name.',true)}else{S.criteria.push({id:uid('c'),name:n,w:10});save()}}
  else if(a==='delcrit'){S.criteria=S.criteria.filter(c=>c.id!==id);save()}
  else if(a==='addjudge'){const n=$('nj').value.trim();if(!n){setMsg('Enter a judge name.',true)}else{S.judges.push({id:uid('j'),name:n});save()}}
  else if(a==='deljudge'){S.judges=S.judges.filter(j=>j.id!==id);Object.keys(S.scores).forEach(k=>{if(k.startsWith(id+'|'))delete S.scores[k]});save()}
  else if(a==='addcand'){const n=$('ncn').value.trim(),p=$('ncp').value.trim();if(!n){setMsg('Enter a candidate name.',true)}else{S.candidates.push({id:uid('a'),name:n,pos:p||'Unspecified role'});save()}}
  else if(a==='delcand'){S.candidates=S.candidates.filter(c=>c.id!==id);Object.keys(S.scores).forEach(k=>{if(k.endsWith('|'+id))delete S.scores[k]});save()}
  const keep=flash;render();if(keep)setMsg(keep.t,keep.err);
});

render();
</script>
</body>
</html>
